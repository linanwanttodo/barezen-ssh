# BareZen-SSH CI：三平台构建 + 测试 + 产物上传 + Release 自动打包
#
# 设计要点：
# 1. 每个平台独立 job（macos/windows/ubuntu）——Compose Desktop 的 jpackage **只能在
#    宿主平台产出对应格式**，跨平台交叉打包不可行，故用 matrix 天然并行三份。
# 2. 版本单一真相源在 gradle.properties 的 barezen.version；tag 推送时用 tag 名覆盖，
#    产物名与 Release 资产名对齐。
# 3. 测试只在 ubuntu 跑一次（三平台跑三遍同样的 JVM 单测纯属浪费），
#    但**每个平台都做编译**，避免只在 Linux 上能编过。
# 4. jpackage 在 Linux 需要 dpkg-deb；ubuntu runner 自带，无需额外装。
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # ---- 门禁：编译 + 单测（只在 ubuntu 跑，三平台重复跑没有额外信息量）----
  verify:
    name: 门禁（编译 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: 编译桌面应用
        run: ./gradlew :desktopApp:compileKotlin --stacktrace
      - name: 单元测试（门禁：0 失败）
        run: ./gradlew :shared:jvmTest --stacktrace

  # ---- 三平台打包 ----
  package:
    name: 打包 ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (deb)
            format: deb
          - os: macos-latest
            name: macOS (dmg)
            format: dmg
          - os: windows-latest
            name: Windows (msi)
            format: msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: 写入版本号
        # tag 推送时用 tag（v1.2.3 -> 1.2.3）覆盖 gradle.properties。
        # BuildInfo 由 Gradle 从该属性生成（shared/build.gradle.kts 的 generateBuildInfo），
        # 故这里只需改这一处，「关于」页显示与包名版本会自动跟随。
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            # 就地替换而不是追加：追加会让 properties 出现两个同名键，后一个生效但极易误读
            sed -i "s/^barezen.version=.*/barezen.version=$VER/" gradle.properties
            grep '^barezen.version=' gradle.properties
          fi

      - name: 构建安装包（${{ matrix.format }}）
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries -type f \
            \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp -v {} dist/ \;
          ls -lh dist/

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: barezen-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  # ---- tag 推送时发 Release（含三平台产物）----
  release:
    name: 发布 Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理并打 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
