# BareZen-SSH CI：三平台构建 + 测试 + 产物上传 + Release 自动打包
#
# 设计要点：
# 1. 每个平台独立 job（macos/windows/ubuntu）——Compose Desktop 的 jpackage **只能在
#    宿主平台产出对应格式**，跨平台交叉打包不可行，故用 matrix 天然并行三份。
# 2. 格式与平台严格对应（jpackage 不会在错平台上产出）：
#    Linux   -> deb + AppImage（deb 走包管理器，AppImage 免安装）
#    macOS   -> dmg（拖拽安装）+ pkg（安装器，可写 /Applications、支持升级链）
#    Windows -> msi
#    AppImage 是 Linux 专属；pkg 仅 macOS 有——两者都不会跨平台产出。
# 3. 版本单一真相源在 gradle.properties 的 barezen.version；tag 推送时用 tag 名覆盖，
#    BuildInfo 由 Gradle 构建期生成（shared 的 generateBuildInfo），故只需改这一处。
# 4. 测试只在 ubuntu 跑一次（三平台跑三遍同样的 JVM 单测纯属浪费），
#    但**每个平台都做编译**，避免只在 Linux 上能编过。
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # ---- 门禁：编译 + 单测（只在 ubuntu 跑，三平台重复跑没有额外信息量）----
  verify:
    name: 门禁（编译 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: 编译桌面应用
        run: ./gradlew :desktopApp:compileKotlin --stacktrace
      - name: 单元测试（门禁：0 失败）
        run: ./gradlew :shared:jvmTest --stacktrace

  # ---- 三平台打包 ----
  package:
    name: 打包 ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (deb + AppImage)
            artifact: linux
          - os: macos-latest
            name: macOS (dmg + pkg)
            artifact: macos
          - os: windows-latest
            name: Windows (msi)
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: 写入版本号
        # tag 推送时用 tag（v1.2.3 -> 1.2.3）覆盖 gradle.properties。
        # 就地替换而不是追加：追加会让 properties 出现两个同名键，后一个生效但极易误读。
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            sed -i "s/^barezen.version=.*/barezen.version=$VER/" gradle.properties
            grep '^barezen.version=' gradle.properties
          fi

      - name: 安装 Linux 打包依赖
        # deb 需要 dpkg-deb / fakeroot；AppImage 需要 appimagetool 合成单文件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot desktop-file-utils
          # appimagetool 本身是个 AppImage，CI 无 FUSE，用 --appimage-extract 取内部二进制
          APPIMAGETOOL=/usr/local/bin/appimagetool
          curl -sL -o "$APPIMAGETOOL" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$APPIMAGETOOL"
          cd "$(mktemp -d)"
          "$APPIMAGETOOL" --appimage-extract >/dev/null
          # 用解包后的 AppRun 当入口：它自带库与 PYTHONPATH，无需系统装 libappimage
          printf '#!/bin/sh\nexec %s/squashfs-root/AppRun "$@"\n' "$(pwd)" > "$APPIMAGETOOL"
          chmod +x "$APPIMAGETOOL"
          "$APPIMAGETOOL" --version

      - name: 构建安装包
        # Linux 额外产出**单文件** AppImage：Compose 的 packageAppImage 只给目录，
        # 单文件由 packageSingleAppImage 调 appimagetool 合成（见 desktopApp/build.gradle.kts）
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ./gradlew :desktopApp:packageDistributionForCurrentOS :desktopApp:packageSingleAppImage --stacktrace
          else
            ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
          fi

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.pkg' \
               -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp -v {} dist/ \;
          echo "--- 产物清单 ---"
          ls -lh dist/

      - name: 校验产物非空
        shell: bash
        run: |
          COUNT=$(ls -1 dist/ 2>/dev/null | wc -l)
          echo "产出 $COUNT 个文件"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有产出任何安装包"
            exit 1
          fi

      - name: AppImage 可运行性冒烟
        # AppImage 运行需 fuse2，CI runner 没有；用 --appimage-extract 验证
        # 「能解包且入口可执行」——足以证明产物结构完整，不会卡在「下下来根本跑不了」。
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE=$(ls -1 dist/*.AppImage 2>/dev/null | head -1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "未产出 AppImage，跳过冒烟"
            exit 0
          fi
          chmod +x "$APPIMAGE"
          cd dist
          # 解包（有些环境无 FUSE 时 extract 仍可用）
          ../$APPIMAGE --appimage-extract || \
            (echo "::warning::AppImage 解包失败（可能缺 FUSE），跳过该项"; exit 0)
          if [ -x squashfs-root/AppRun ]; then
            echo "AppImage 解包成功，AppRun 可执行"
          else
            echo "::error::AppImage 缺少可执行的 AppRun"
            exit 1
          fi

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: barezen-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ---- tag 推送时发 Release（含三平台产物）----
  release:
    name: 发布 Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理并打 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
